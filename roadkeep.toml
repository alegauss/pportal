prefix = "PP"

# how a rationale section is addressed: "id" derives the pointer from the
# task's own id, "outline" keeps a hand-numbered anchor
ref_scheme = "id"

# PP39 jumps everything, and it is the only line here whose window closes rather than moves.
# The four counters this application already computes - measured_bitrate, frames_lost,
# droppedFrames and the decoder delivery timestamp - are drawn on screen and never written down,
# and the build that produces them is the one scheduled for deletion. Recorded late, the baseline
# describes a tree that has already been half converted; not recorded at all, "faster" and
# "slower" become two opinions nobody can settle, which is the outcome this block exists to
# refuse.
#
# Block H follows it for the same reason one level along: PP43 measures the two present paths
# before PP9 commits to one, and PP44 sets the allocation budget before PP27 writes the transport
# that has to meet it. Both are now deps rather than advice.
#
# Block I is third, on instruction (2026-08-11): NVIDIA first, which is a focus and not a
# requirement - PP51 is where the second half of that sentence is written down, and the app still
# has to run on an ordinary Intel laptop. It sits behind Block H rather than beside it because
# every line in it is an evaluation with a number as its output, and PP41 and PP43 are what
# produce numbers at all. Two of the seven are not image quality: PP53 removes waiting for a
# vblank, which is the only one that makes a frame arrive earlier, and PP52 pays a debt the port
# already has by taking speexdsp off the CPU.
#
# The rest of the order is block order plus deps.
#
# The two paths below: BLOCK F, chosen 2026-08-27.
#
# Block B and Block F are two answers to the same question. B keeps the C core and writes the
# interop boundary a managed UI calls through; F replaces the core with managed code and makes
# B's boundary temporary by construction. Both were filed because both were real, and the overlap
# was stated rather than hidden: PP4 and PP5 are work that F would eventually retire.
#
# Running both at once is the one option that is certainly wrong - it pays for the shim twice,
# which is why this needed answering rather than deferring. Block B holds no open line, so the
# choice retires nothing; what it settles is which of the two the next task belongs to, and
# every line still open under B's argument is F's now.
#
# What made it answerable: PP23 closed the same day. Four channels of a real PS5 exchange replay
# against managed participants, so the oracle for the remaining translation is a recording from
# hardware rather than the C being replaced - which is the thing F needs and B does not.
#
# PP294 is where F starts: ctrl.c, and it unblocks four of the open lines. A file that size
# lands through `ship --part`, one recorded half at a time.
#
# WHO OWNS THE SOCKETS: THE SHIM, ONE CHANNEL AT A TIME. Chosen 2026-08-27, and it was one
# question asked three times - PP294 needs it for ctrl, PP27 for takion, PP340 for the punch, and
# PP29, PP295, PP30 and PP33 are behind those three. A review of every open line found the front
# is five lines and that three of them were waiting on this.
#
# The shim exposes connect, send and receive-one-message; the loop becomes managed; the C stays
# behind it until managed code is. It is what §PP340 already proposed - "a seam the session thread
# asks for a socket and an address through" - and it is incremental, so each channel migrates with
# PP297's recording as its oracle. PP445 measured the cost of the alternative shape's first step:
# one export, and PP437's census covers a new one in both directions for free.
#
# The other answer - managed sockets, stopping the C threads - is the end state and not the first
# move: its first channel already needs lib/ changed to be able to stop a thread, and the corpus
# holds type and payload rather than framed bytes, so framing would debut with no oracle at all.
#
# what jumps the queue, in order: an id or a "Block X", and nothing else.
# The queue itself now lives in the "## Priority" section of docs/ROADMAP.md, where the
# queue verbs reach it and `ship` takes a shipped id out of it on its own. The reasoning
# above is kept here because it is why the order is what it is, not the order itself.

[files]
roadmap = "docs/ROADMAP.md"
changelog = "docs/CHANGELOG.md"
improvements = "docs/IMPROVEMENTS.md"

# The store for "not now", declared because this port has a line that is neither shipped
# nor abandoned: PP55 names an instrument - a G-SYNC panel carrying the Reflex Latency
# Analyzer - that this machine does not have, and retiring it would delete a rationale
# that a capable monitor makes true again. Without this path `defer` refuses and the only
# doors are the two terminal ones.
deferred = "docs/DEFERRED.md"

[limits]
# characters
symptom = 120
why = 200
line = 320

# a section is prose, so its budget is words; prose is the width one is filled to
section = 250
prose = 88

[markers]
open = ["📋", "💭", "⏳", "🛠"]
shipped = "✅"
retired = "🗑"

[claims]
# minutes a claim on a line reads as held, before a later caller steps over it
held = 60

# PP312: what blocks a line that is not another line.
#
# `brief` answered PP23 on four consecutive sessions and PP23 could not be started on any of
# them: its remaining half needed PP297's captured exchange, which needed a console reaching the
# stream. Deps could not say so, correctly — PP23's were satisfied and PP297's were empty, and
# both WERE ready in the only sense a dep graph means it. What was missing is that starting
# either one needed a thing this machine does not have, and a queue that cannot express that
# offers the same unstartable line every time it is asked.
#
# That worked: the console was declared with `--have`, the exchange was captured, and PP23
# closed on 2026-08-27. `console` has left this list because nothing waits on it any more.
#
# Four lines are in that state and each names a different absent thing. A requirement is not a
# dep and does not become one: nothing here will ever satisfy `runner` by shipping a task.
[requirements]
declared = [
    # `console` left this array on 2026-08-27, when PP23 closed - the recording is what its
    # remaining half was for, and four channels of a real exchange now replay against managed
    # participants. A requirement nothing waits on says the backlog is still short of something it
    # has, which is what BacklogRequirementsTests reported in the commit that shipped PP23.
    #
    # It is back on 2026-08-28 because PP481 waits on it. PP481 implements the nine holepunch asks
    # over the real C, and its own symptom says no test can exercise one without a live console: the
    # nine shim wrappers and the ABI bump are mechanical, and what cannot be faked is a session that
    # punched a hole to a machine on the internet. It leaves again the same way, when PP481 closes.
    #
    # PP486 is why the omission was found. The two checks either side of this array - declared
    # against used, used against declared - were both green while that line said in words that it
    # needed hardware and declared nothing, so `pick` offered it as the next ready thing to do.
    "console",
    #
    # Visual Studio Build Tools with the C++ workload AND Qt for msvc2022_64 carrying
    # QtWebEngine, from an installer wanting an account. Two multi-gigabyte installs, and
    # PP63 itself argues the second toolchain has to be kept away from ordinary work.
    "msvc-qt-webengine",
    # A CI run: a push and a wait, not a step. Nothing in a checkout answers whether the
    # workflow goes green, which is the honest boundary PP22's assertions stop at.
    "runner",
    # A code-signing certificate, which is a purchase and an identity check against a legal
    # entity rather than anything a commit can produce.
    "signing-certificate",
    # "a-person-looking" was declared here for PP163 and left with it on 2026-08-23. PP284's window
    # was looked at, and the reading was a fourth outcome it had not predicted - solid red over the
    # whole client area, with --topmost reading identically. Worth keeping from the entry that
    # stood here: what the session could not do was CAPTURE the window, and what closed it was a
    # person taking a screenshot themselves. That is a narrower boundary than "a person looks", and
    # a line needing this again should say which of the two it means.
    #
    # PP322 is that line, and it means the narrow one: someone puts the window on a screen and says
    # what colour is in the middle of it. `--dcomp-demo --layers` builds the tree and writes down
    # what each possible reading decides; a session can run it and cannot see it, because a composed
    # window does not screenshot reliably and a test claiming to read one would be reporting on its
    # own capture stack. Re-declared under the name it had, because it is the same absence.
    "a-person-looking",
]

# Declared at all means governed. This port's constraints are the load-bearing part of it —
# "Windows-only" and "no redesign while porting" are what keep a screen from being re-invented
# instead of reproduced — so they are refused at input like every other line, rather than being
# the one part of the roadmap no schema reaches. The limits are left at their defaults.
[non_goals]

# Declared because this port's largest lines cannot be finished and cannot show progress, and
# those are two different problems. PP33's own measure is a `remaining` query counting curl and
# json-c call sites in lib/src — 420 of them, and it will read 420 until libchiaki's C is
# deleted, because porting INTO app/ removes no line of C. Four tasks of real work moved it by
# nothing. A number that only leaves zero at the finish cannot tell half done from not started,
# which is the failure this list exists to answer. The limits are left at their defaults.
[criteria]
