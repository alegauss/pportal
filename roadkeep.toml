prefix = "PP"

# how a rationale section is addressed: "id" derives the pointer from the
# task's own id, "outline" keeps a hand-numbered anchor
ref_scheme = "id"

# PP39 jumps everything, and it is the only line here whose window closes rather than moves.
# The four counters this application already computes - measured_bitrate, frames_lost,
# droppedFrames and the decoder delivery timestamp - are drawn on screen and never written down,
# and the build that produces them is the one scheduled for deletion. Recorded late, the baseline
# describes a tree that has already been half converted; not recorded at all, "faster" and
# "slower" become two opinions nobody can settle, which is the outcome this block exists to
# refuse.
#
# Block H follows it for the same reason one level along: PP43 measures the two present paths
# before PP9 commits to one, and PP44 sets the allocation budget before PP27 writes the transport
# that has to meet it. Both are now deps rather than advice.
#
# Block I is third, on instruction (2026-08-11): NVIDIA first, which is a focus and not a
# requirement - PP51 is where the second half of that sentence is written down, and the app still
# has to run on an ordinary Intel laptop. It sits behind Block H rather than beside it because
# every line in it is an evaluation with a number as its output, and PP41 and PP43 are what
# produce numbers at all. Two of the seven are not image quality: PP53 removes waiting for a
# vblank, which is the only one that makes a frame arrive earlier, and PP52 pays a debt the port
# already has by taking speexdsp off the CPU.
#
# The rest of the order is block order plus deps.
#
# On the two paths below, the decision is still nobody's:
#
# Block B and Block F are two answers to the same question. B keeps the C core and writes the
# interop boundary a managed UI calls through; F replaces the core with managed code and makes
# B's boundary temporary by construction. Both are filed because both are real, and the overlap
# is stated rather than hidden: PP4 and PP5 are work that F would eventually retire.
#
# Running both at once is the one option that is certainly wrong - it pays for the shim twice.
# The choice does not have to be taken yet: PP39 comes before either, and PP1 - the .NET host -
# is needed by both, so the first two things to do are the same under both answers.
#
# what jumps the queue, in order: an id or a "Block X", and nothing else.
# The queue itself now lives in the "## Priority" section of docs/ROADMAP.md, where the
# queue verbs reach it and `ship` takes a shipped id out of it on its own. The reasoning
# above is kept here because it is why the order is what it is, not the order itself.

[files]
roadmap = "docs/ROADMAP.md"
changelog = "docs/CHANGELOG.md"
improvements = "docs/IMPROVEMENTS.md"

# The store for "not now", declared because this port has a line that is neither shipped
# nor abandoned: PP55 names an instrument - a G-SYNC panel carrying the Reflex Latency
# Analyzer - that this machine does not have, and retiring it would delete a rationale
# that a capable monitor makes true again. Without this path `defer` refuses and the only
# doors are the two terminal ones.
deferred = "docs/DEFERRED.md"

[limits]
# characters
symptom = 120
why = 200
line = 320

# a section is prose, so its budget is words; prose is the width one is filled to
section = 250
prose = 88

[markers]
open = ["📋", "💭", "⏳", "🛠"]
shipped = "✅"
retired = "🗑"

[claims]
# minutes a claim on a line reads as held, before a later caller steps over it
held = 60

# PP312: what blocks a line that is not another line.
#
# `brief` answered PP23 on four consecutive sessions and PP23 could not be started on any of
# them: its remaining half needs PP297's captured exchange, which needs a console reaching the
# stream. Deps could not say so, correctly — PP23's are satisfied and PP297's are empty, and
# both ARE ready in the only sense a dep graph means it. What was missing is that starting
# either one needs a thing this machine does not have, and a queue that cannot express that
# offers the same unstartable line every time it is asked.
#
# Five lines are in that state and each names a different absent thing. A requirement is not a
# dep and does not become one: nothing here will ever satisfy `console` by shipping a task.
[requirements]
declared = [
    # A PS5 on the LAN, reachable and able to reach the stream. PP297's recording is a thing to
    # do rather than a thing to write, and PP23's remaining half is what the recording is for.
    "console",
    # Visual Studio Build Tools with the C++ workload AND Qt for msvc2022_64 carrying
    # QtWebEngine, from an installer wanting an account. Two multi-gigabyte installs, and
    # PP63 itself argues the second toolchain has to be kept away from ordinary work.
    "msvc-qt-webengine",
    # A CI run: a push and a wait, not a step. Nothing in a checkout answers whether the
    # workflow goes green, which is the honest boundary PP22's assertions stop at.
    "runner",
    # A code-signing certificate, which is a purchase and an identity check against a legal
    # entity rather than anything a commit can produce.
    "signing-certificate",
    # Somebody at this machine looking at the screen. PP284 built its window saying so - "a
    # person answers in one glance" - because a composed window does not screenshot reliably
    # and a check reading one would report on its own capture stack. Tried anyway on
    # 2026-08-22: the capture returned whatever was in front of the demo, which is the second
    # reason and the worse one. This is not a thing a session does; it is a thing a person does.
    "a-person-looking",
]

# Declared at all means governed. This port's constraints are the load-bearing part of it —
# "Windows-only" and "no redesign while porting" are what keep a screen from being re-invented
# instead of reproduced — so they are refused at input like every other line, rather than being
# the one part of the roadmap no schema reaches. The limits are left at their defaults.
[non_goals]

# Declared because this port's largest lines cannot be finished and cannot show progress, and
# those are two different problems. PP33's own measure is a `remaining` query counting curl and
# json-c call sites in lib/src — 420 of them, and it will read 420 until libchiaki's C is
# deleted, because porting INTO app/ removes no line of C. Four tasks of real work moved it by
# nothing. A number that only leaves zero at the finish cannot tell half done from not started,
# which is the failure this list exists to answer. The limits are left at their defaults.
[criteria]
