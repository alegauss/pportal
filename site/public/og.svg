<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1e"/>
      <stop offset="1" stop-color="#151d3a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f9dff"/>
      <stop offset="0.55" stop-color="#5b6cf9"/>
      <stop offset="1" stop-color="#2f3aa8"/>
    </linearGradient>
    <linearGradient id="mouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22b8c6"/>
      <stop offset="1" stop-color="#2f3aa8"/>
    </linearGradient>
    <clipPath id="inside">
      <ellipse cx="150" cy="196" rx="51" ry="75"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#card-bg)"/>

  <!-- the same signal the page is bounded by, quieter -->
  <path d="M0 560 c90 -46 180 46 270 0 c90 -46 180 46 270 0 c90 -46 180 46 270 0 c90 -46 180 46 270 0 V630 H0 Z"
        fill="#5b6cf9" opacity="0.16"/>
  <path d="M0 588 c60 -30 120 30 180 0 c60 -30 120 30 180 0 c60 -30 120 30 180 0 c60 -30 120 30 180 0 c60 -30 120 30 180 0 c60 -30 120 30 180 0 V630 H0 Z"
        fill="#8f9dff" opacity="0.2"/>

  <!-- the mark -->
  <ellipse cx="150" cy="196" rx="60" ry="84" fill="none" stroke="url(#ring)" stroke-width="18"/>
  <ellipse cx="150" cy="196" rx="28.5" ry="45" fill="url(#mouth)" opacity="0.9"/>
  <path d="M36 196 c18 -27 36 27 54 0 c18 -27 36 27 54 0 c18 -27 36 27 54 0 c12 -18 24 18 30 0"
        fill="none" stroke="#5b6cf9" stroke-width="10" stroke-linecap="round" opacity="0.45"/>
  <g clip-path="url(#inside)">
    <path d="M36 196 c18 -27 36 27 54 0 c18 -27 36 27 54 0 c18 -27 36 27 54 0 c12 -18 24 18 30 0"
          fill="none" stroke="#c9f4f8" stroke-width="11" stroke-linecap="round"/>
  </g>

  <text x="252" y="176" fill="#e9ecfb" font-family="DejaVu Sans" font-size="86" font-weight="bold">PPortal</text>
  <text x="256" y="236" fill="#8f9dff" font-family="DejaVu Sans" font-size="30">PlayStation Remote Play, rebuilt for Windows</text>

  <text x="90" y="374" fill="#e9ecfb" font-family="DejaVu Sans" font-size="40">Ten-bit video through DirectComposition, hardware</text>
  <text x="90" y="428" fill="#e9ecfb" font-family="DejaVu Sans" font-size="40">decode on the card you own, and no bundled browser.</text>

  <text x="90" y="502" fill="#a3aecb" font-family="DejaVu Sans" font-size="26">.NET 10 and WPF  ·  Windows 10 / 11  ·  AGPL-3.0  ·  no account, no telemetry</text>
</svg>
