<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72" role="img" aria-label="PPortal">
  <defs>
    <linearGradient id="pp-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f9dff"/>
      <stop offset="0.55" stop-color="#5b6cf9"/>
      <stop offset="1" stop-color="#2f3aa8"/>
    </linearGradient>
    <linearGradient id="pp-mouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22b8c6"/>
      <stop offset="1" stop-color="#2f3aa8"/>
    </linearGradient>
    <clipPath id="pp-inside">
      <ellipse cx="32" cy="36" rx="17" ry="25"/>
    </clipPath>
  </defs>

  <!-- The portal: a doorway seen face on, open in the middle. -->
  <ellipse cx="32" cy="36" rx="20" ry="28" fill="none" stroke="url(#pp-ring)" stroke-width="6"/>
  <ellipse cx="32" cy="36" rx="9.5" ry="15" fill="url(#pp-mouth)" opacity="0.9"/>

  <!-- The stream passing through it: dim outside the opening, lit inside. -->
  <path d="M0 36 c6 -9 12 9 18 0 c6 -9 12 9 18 0 c6 -9 12 9 18 0 c4 -6 8 6 10 0"
        fill="none" stroke="#5b6cf9" stroke-width="3.4" stroke-linecap="round" opacity="0.45"/>
  <g clip-path="url(#pp-inside)">
    <path d="M0 36 c6 -9 12 9 18 0 c6 -9 12 9 18 0 c6 -9 12 9 18 0 c4 -6 8 6 10 0"
          fill="none" stroke="#c9f4f8" stroke-width="3.6" stroke-linecap="round"/>
  </g>
</svg>
